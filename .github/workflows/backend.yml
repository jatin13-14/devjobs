name: Backend verification

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5
        env:
          PGPORT: 5433
          POSTGRES_DB: devjobs_test
          POSTGRES_USER: devjobs
          POSTGRES_PASSWORD: devjobs
        ports:
          - 5433:5433
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5433 -U devjobs -d devjobs_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: 'false'
      DJANGO_SECRET_KEY: ci-only-placeholder-not-a-real-secret-32chars
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://devjobs:devjobs@127.0.0.1:5433/devjobs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/dev.txt
      - run: python -m pip install -r requirements/dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python -m pytest
      - run: ruff check .
