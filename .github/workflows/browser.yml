name: Chromium browser verification

on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/browser.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/browser.yml'

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements/dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: frontend
      - run: python run_browser.py
        working-directory: backend
      # Traces/HTML/network logs can contain JWTs and registration passwords.
      # Only screenshots of synthetic UI state are eligible for upload.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: chromium-failure-screenshots
          path: /tmp/devjobs-e2e-*-results/**/*.png
          if-no-files-found: ignore
          retention-days: 3
