name: Chromium browser verification

on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/browser.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/browser.yml'

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.5
        env:
          # PGPORT sets the server default as well as the libpq client default.
          PGPORT: 5433
          POSTGRES_DB: devjobs_test
          POSTGRES_USER: devjobs
          POSTGRES_PASSWORD: devjobs
        ports:
          - 5433:5433
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5433 -U devjobs -d devjobs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://devjobs:devjobs@127.0.0.1:5433/devjobs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements/dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: frontend
      - run: python run_browser.py
        working-directory: backend
      # Traces/HTML/network logs can contain JWTs and registration passwords.
      # Only screenshots of synthetic UI state are eligible for upload.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chromium-failure-screenshots
          path: frontend/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 3
