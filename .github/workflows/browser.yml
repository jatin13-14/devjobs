name: Chromium browser verification

on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/browser.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/browser.yml'

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements/dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: frontend
      - run: python run_browser.py
        working-directory: backend
      # Traces/HTML/network logs can contain JWTs and registration passwords.
      # Only screenshots of synthetic UI state are eligible for upload.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chromium-failure-screenshots
          path: /tmp/devjobs-e2e-*-results/**/*.png
          if-no-files-found: ignore
          retention-days: 3
