openapi: 3.1.0
info:
  title: DevJobs API
  version: 1.0.0
  description: Authentication, profile, company, job, candidate application, and recruiter applicant-management endpoints for the DevJobs MVP.
servers:
  - url: /
paths:
  /ready/:
    get:
      summary: Aggregate database, cache and private storage readiness
      security: []
      responses:
        '200':
          description: Required dependencies available
        '503':
          description: Required dependency unavailable; no infrastructure details

  /api/v1/admin/companies/:
    get:
      summary: Administrator-only paginated companies; search and state filters
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: state, schema: { type: string, enum: [active, restricted] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Paginated count/next/previous/results; private administrative records without storage references. }
        '401': { description: Authentication required. }
        '403': { description: Trusted active staff/superuser required. }
  /api/v1/admin/companies/{target_id}/:
    parameters:
      - { in: path, name: target_id, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Inspect companies as platform administrator
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Administrative record; excludes resume keys and credentials. }
        '403': { description: Platform administrator required. }
        '404': { description: Target missing. }
    post:
      summary: Record an atomic moderation decision for companies
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, reason]
              properties:
                action: { type: string, enum: [suspend, reactivate] }
                reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200': { description: Changed record; append-only audit event committed atomically. }
        '400': { description: Invalid action, reason or already in requested state. }
        '403': { description: Platform administrator required; privileged accounts cannot be moderated. }
        '404': { description: Target missing. }
  /api/v1/admin/recruiters/:
    get:
      summary: Administrator-only paginated recruiters; search and state filters
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: state, schema: { type: string, enum: [active, restricted] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Paginated count/next/previous/results; private administrative records without storage references. }
        '401': { description: Authentication required. }
        '403': { description: Trusted active staff/superuser required. }
  /api/v1/admin/recruiters/{target_id}/:
    parameters:
      - { in: path, name: target_id, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Inspect recruiters as platform administrator
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Administrative record; excludes resume keys and credentials. }
        '403': { description: Platform administrator required. }
        '404': { description: Target missing. }
    post:
      summary: Record an atomic moderation decision for recruiters
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, reason]
              properties:
                action: { type: string, enum: [suspend, reactivate] }
                reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200': { description: Changed record; append-only audit event committed atomically. }
        '400': { description: Invalid action, reason or already in requested state. }
        '403': { description: Platform administrator required; privileged accounts cannot be moderated. }
        '404': { description: Target missing. }
  /api/v1/admin/candidates/:
    get:
      summary: Administrator-only paginated candidates; search and state filters
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: state, schema: { type: string, enum: [active, restricted] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Paginated count/next/previous/results; private administrative records without storage references. }
        '401': { description: Authentication required. }
        '403': { description: Trusted active staff/superuser required. }
  /api/v1/admin/candidates/{target_id}/:
    parameters:
      - { in: path, name: target_id, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Inspect candidates as platform administrator
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Administrative record; excludes resume keys and credentials. }
        '403': { description: Platform administrator required. }
        '404': { description: Target missing. }
    post:
      summary: Record an atomic moderation decision for candidates
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, reason]
              properties:
                action: { type: string, enum: [suspend, reactivate] }
                reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200': { description: Changed record; append-only audit event committed atomically. }
        '400': { description: Invalid action, reason or already in requested state. }
        '403': { description: Platform administrator required; privileged accounts cannot be moderated. }
        '404': { description: Target missing. }
  /api/v1/admin/jobs/:
    get:
      summary: Administrator-only paginated jobs; search and state filters
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: state, schema: { type: string, enum: [active, restricted] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Paginated count/next/previous/results; private administrative records without storage references. }
        '401': { description: Authentication required. }
        '403': { description: Trusted active staff/superuser required. }
  /api/v1/admin/jobs/{target_id}/:
    parameters:
      - { in: path, name: target_id, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Inspect jobs as platform administrator
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Administrative record; excludes resume keys and credentials. }
        '403': { description: Platform administrator required. }
        '404': { description: Target missing. }
    post:
      summary: Record an atomic moderation decision for jobs
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, reason]
              properties:
                action: { type: string, enum: [hide, restore] }
                reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200': { description: Changed record; append-only audit event committed atomically. }
        '400': { description: Invalid action, reason or already in requested state. }
        '403': { description: Platform administrator required; privileged accounts cannot be moderated. }
        '404': { description: Target missing. }
  /api/v1/admin/overview/:
    get:
      summary: Resource counts
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Resource counts. }
        '403': { description: Platform administrator required. }
  /api/v1/admin/history/:
    get:
      summary: Paginated immutable audit events; target_type, target_id and action filters
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paginated immutable audit events; target_type, target_id and action filters. }
        '403': { description: Platform administrator required. }
  /api/v1/candidates/me/resume/:
    get:
      summary: Read own resume metadata (resume is null when absent)
      operationId: candidateResumeMetadata
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Safe metadata only; no storage keys, paths or URLs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeStatus' }
        '401': { description: Authentication required. }
        '403': { description: Candidate account required. }
        '404': { description: Candidate profile missing. }
    put:
      summary: Upload or atomically replace own current resume
      operationId: replaceCandidateResume
      security: [{ bearerAuth: [] }]
      description: Exactly one structurally valid, unencrypted PDF with pages. Default limit 5242880 bytes, configurable with RESUME_MAX_BYTES. Filename and client MIME are ignored.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              additionalProperties: false
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Current resume metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeStatus' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Authentication required. }
        '403': { description: Candidate account required. }
        '404': { description: Candidate profile missing. }
        '415': { description: multipart/form-data required. }
        '503': { description: Storage or database operation failed; previous resume retained. }
    delete:
      summary: Idempotently delete own resume and revoke future downloads
      operationId: deleteCandidateResume
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Resume absent; file cleanup runs after commit. }
        '401': { description: Authentication required. }
        '403': { description: Candidate account required. }
        '404': { description: Candidate profile missing. }
        '503': { description: Database operation failed. }
  /api/v1/candidates/me/resume/download/:
    get:
      summary: Download own current resume
      operationId: downloadCandidateResume
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/ResumeDownload' }
        '401': { description: Authentication required. }
        '403': { description: Candidate account required. }
        '404': { description: Resume unavailable. }
  /api/v1/jobs/{job_id}/applications/{application_id}/resume/:
    parameters:
      - { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: application_id, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Download an applicant's current resume
      operationId: downloadApplicantResume
      security: [{ bearerAuth: [] }]
      description: Active recruiter and active OWNER/ADMIN membership for the job company required on every request. Withdrawn applications and inactive candidates are denied. Closed/expired jobs and rejected applications retain access. No application snapshot is stored.
      responses:
        '200': { $ref: '#/components/responses/ResumeDownload' }
        '401': { description: Authentication required. }
        '403': { description: Active company OWNER/ADMIN required. }
        '404': { description: Job/application missing, application belongs to another job, withdrawn application, inactive candidate or missing resume. }
  /api/v1/companies/:
    post:
      summary: Create a company and become its first active owner
      operationId: createCompany
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyInput' }
      responses:
        '201':
          description: Company and creator's active owner membership.
          content:
            application/json:
              schema:
                type: object
                required: [company, membership]
                properties:
                  company: { $ref: '#/components/schemas/Company' }
                  membership: { $ref: '#/components/schemas/CompanyMembership' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Authentication required. }
        '403': { description: Recruiter account required. }
  /api/v1/companies/{company_id}/:
    parameters:
      - in: path
        name: company_id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read public company information
      operationId: getCompany
      responses:
        '200':
          description: Public company fields; the private logo storage reference is omitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '404': { description: Company not found. }
    patch:
      summary: Update company information
      operationId: updateCompany
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyInput' }
      responses:
        '200': { description: Updated company information. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Authentication required. }
        '403': { description: Active owner or admin membership required. }
  /api/v1/companies/{company_id}/members/:
    parameters:
      - in: path
        name: company_id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List company recruiter memberships
      operationId: listCompanyMembers
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Memberships with recruiter display name and account ID only.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CompanyMembership' }
        '403': { description: Active owner or admin membership required. }
    post:
      summary: Add or invite a recruiter to a company
      operationId: addCompanyMember
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyMembershipInput' }
      responses:
        '201': { description: Membership created. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: Active owner or admin membership required. }
  /api/v1/companies/{company_id}/members/{membership_id}/:
    parameters:
      - in: path
        name: company_id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: membership_id
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Change membership role or status, including ownership transfer
      operationId: updateCompanyMember
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyMembershipUpdate' }
      responses:
        '200': { description: Updated membership. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: Active owner or admin membership required. }
        '404': { description: Membership does not belong to this company. }
    delete:
      summary: Remove a non-owner membership
      operationId: removeCompanyMember
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Membership removed. }
        '400': { description: The active owner must transfer ownership first. }
        '403': { description: Active owner or admin membership required. }
        '404': { description: Membership does not belong to this company. }
  /api/v1/auth/candidate/register/:
    post:
      summary: Register a candidate
      operationId: registerCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateRegistration'
      responses:
        '201':
          description: Candidate account and profile created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeUser'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/recruiter/register/:
    post:
      summary: Register a recruiter
      operationId: registerRecruiter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecruiterRegistration'
      responses:
        '201':
          description: Recruiter account and profile created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeUser'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/login/:
    post:
      summary: Obtain JWTs using email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT pair and safe user identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Invalid credentials.
        '429':
          description: Token issuance rate limit exceeded.
  /api/v1/auth/token/:
    post:
      summary: Compatibility route for login
      operationId: obtainTokenPair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT pair and safe user identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Invalid credentials.
        '429':
          description: Token issuance rate limit exceeded.
  /api/v1/auth/token/refresh/:
    post:
      summary: Refresh an access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh:
                  type: string
      responses:
        '200':
          description: New access token.
          content:
            application/json:
              schema:
                type: object
                required: [access]
                properties:
                  access:
                    type: string
                  refresh:
                    type: string
        '400':
          description: Missing refresh token.
        '401':
          description: Invalid or expired refresh token.
  /api/v1/candidates/me/profile/:
    get:
      summary: Read the authenticated candidate profile
      operationId: getCandidateProfile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Candidate profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfile'
        '401': { description: Authentication required. }
        '403': { description: Candidate role required. }
    patch:
      summary: Partially update the authenticated candidate profile
      operationId: patchCandidateProfile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateProfileUpdate'
      responses:
        '200':
          description: Updated candidate profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfile'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Authentication required. }
        '403': { description: Candidate role required. }
  /api/v1/candidates/me/skills/:
    get:
      summary: List the authenticated candidate skills
      operationId: listCandidateSkills
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Skills, ordered by normalized name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Skill' }
        '401': { description: Authentication required. }
        '403': { description: Candidate role required. }
    post:
      summary: Add a skill to the authenticated candidate
      operationId: addCandidateSkill
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80, example: "  PYTHON Developer " }
      responses:
        '201':
          description: New candidate-skill association.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '200':
          description: Existing association reused.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Authentication required. }
        '403': { description: Candidate role required. }
  /api/v1/candidates/me/skills/{skill_id}/:
    delete:
      summary: Remove a skill from the authenticated candidate
      operationId: removeCandidateSkill
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: skill_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Association removed. }
        '401': { description: Authentication required. }
        '403': { description: Candidate role required. }
        '404': { description: Association not found for this candidate. }
  /api/v1/recruiters/me/profile/:
    get:
      summary: Read the authenticated recruiter profile
      operationId: getRecruiterProfile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Recruiter profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecruiterProfile' }
        '401': { description: Authentication required. }
        '403': { description: Recruiter role required. }
    patch:
      summary: Partially update the authenticated recruiter profile
      operationId: patchRecruiterProfile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecruiterProfileUpdate' }
      responses:
        '200':
          description: Updated recruiter profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecruiterProfile' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: Authentication required. }
        '403': { description: Recruiter role required. }
  /api/v1/recruiters/me/companies/:
    get:
      summary: List active company memberships for the authenticated recruiter
      operationId: listMyRecruiterCompanies
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active memberships; an empty array means the recruiter has no active company memberships.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, membership_id, role]
                  properties:
                    id: { type: string, format: uuid, description: Company UUID. }
                    name: { type: string }
                    membership_id: { type: string, format: uuid }
                    role: { type: string, enum: [OWNER, ADMIN, MEMBER] }
        '401': { description: Authentication required. }
        '403': { description: Recruiter role required. }
  /api/v1/jobs/:
    get:
      summary: Search published, non-expired jobs
      operationId: listJobs
      parameters:
        - { in: query, name: search, schema: { type: string }, description: Search title and description. }
        - { in: query, name: country, schema: { type: string, pattern: '^[A-Z]{2}$' } }
        - { in: query, name: location, schema: { type: string } }
        - { in: query, name: workplace_type, schema: { type: string, enum: [REMOTE, HYBRID, ON_SITE] } }
        - { in: query, name: employment_type, schema: { type: string, enum: [FULL_TIME, PART_TIME, CONTRACT, TEMPORARY, INTERNSHIP] } }
        - { in: query, name: experience_level, schema: { type: string, enum: [ENTRY, MID, SENIOR, LEAD] } }
        - { in: query, name: skill, schema: { type: string } }
        - { in: query, name: company, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Paginated public jobs. }
    post:
      summary: Create a draft job
      operationId: createJob
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobInput' }
      responses:
        '201': { description: Draft created. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: Active recruiter OWNER or ADMIN membership required. }
  /api/v1/jobs/{job_id}/:
    parameters:
      - { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Read public job details
      operationId: getJob
      responses:
        '200': { description: Published, non-expired job details. }
        '404': { description: Missing, draft, closed, or expired job. }
    patch:
      summary: Update an authorized company's job
      operationId: updateJob
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobInput' }
      responses:
        '200': { description: Updated job. }
        '403': { description: Active company OWNER or ADMIN membership required. }
  /api/v1/jobs/{job_id}/publish/:
    post:
      summary: Publish a draft job
      operationId: publishJob
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Published job. }
        '400': { description: Closed jobs cannot be republished. }
        '403': { description: Active company OWNER or ADMIN membership required. }
  /api/v1/jobs/{job_id}/close/:
    post:
      summary: Close a job
      operationId: closeJob
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Closed job. }
        '403': { description: Active company OWNER or ADMIN membership required. }
  /api/v1/companies/{company_id}/jobs/:
    get:
      summary: List visible jobs for a company
      operationId: listCompanyJobs
      parameters:
        - name: status
          in: query
          description: Filters within the caller's authorized company job visibility.
          schema: {type: string, enum: [DRAFT, PUBLISHED, CLOSED]}
        - { in: path, name: company_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: OWNER/ADMIN members see drafts; other callers see public jobs. }
        '404': { description: Company not found. }
  /api/v1/jobs/{job_id}/applications/:
    parameters:
      - { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Apply to a published, open job
      operationId: applyToJob
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationInput' }
      responses:
        '201': { description: Application submitted. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: Candidate profile required. }
    get:
      summary: List applicants for a job
      operationId: listJobApplicants
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Paginated applications with an additive resume_available boolean; requires active company OWNER or ADMIN membership. }
        '403': { description: Active company OWNER or ADMIN membership required. }
  /api/v1/jobs/{job_id}/applications/{application_id}/:
    parameters:
      - { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: application_id, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Retrieve an applicant for an authorized job
      operationId: getJobApplicant
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Applicant details with limited candidate profile fields and an additive resume_available boolean (false when withdrawn, inactive candidate or resume absent). }
        '403': { description: Active company OWNER or ADMIN membership required. }
        '404': { description: Job or job application not found. }
  /api/v1/jobs/{job_id}/applications/{application_id}/status/:
    parameters:
      - { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: application_id, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Update an applicant status
      operationId: updateApplicationStatus
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationStatusUpdate' }
      responses:
        '200': { description: Status updated and recorded in history. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: Active company OWNER or ADMIN membership required. }
        '404': { description: Job or job application not found. }
  /api/v1/candidates/me/applications/:
    get:
      summary: List the authenticated candidate's applications
      operationId: listMyApplications
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Paginated applications belonging to the authenticated candidate, including resume_available. }
        '403': { description: Candidate profile required. }
  /api/v1/candidates/me/applications/{application_id}/:
    parameters:
      - { in: path, name: application_id, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Retrieve the authenticated candidate's application
      operationId: getMyApplication
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Candidate-owned application including resume_available. }
        '404': { description: Application not found. }
    patch:
      summary: Withdraw an eligible application using an empty object
      operationId: withdrawMyApplication
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200': { description: Application withdrawn. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: Application not found. }
components:
  schemas:
    ResumeStatus:
      type: object
      required: [resume]
      additionalProperties: false
      properties:
        resume:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/ResumeMetadata' }
    ResumeMetadata:
      type: object
      required: [filename, content_type, size, updated_at]
      additionalProperties: false
      properties:
        filename: { type: string, const: resume.pdf }
        content_type: { type: string, const: application/pdf }
        size: { type: integer, minimum: 1 }
        updated_at: { type: string, format: date-time }
    ApplicationInput:
      type: object
      additionalProperties: false
      properties:
        cover_letter: { type: string, maxLength: 5000 }
    ApplicationStatusUpdate:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [REVIEWING, SHORTLISTED, REJECTED] }
    JobInput:
      type: object
      required: [company_id, title, description, employment_type, workplace_type, experience_level]
      properties:
        company_id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 20000 }
        employment_type: { type: string, enum: [FULL_TIME, PART_TIME, CONTRACT, TEMPORARY, INTERNSHIP] }
        workplace_type: { type: string, enum: [REMOTE, HYBRID, ON_SITE] }
        location: { type: string, maxLength: 160 }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        experience_level: { type: string, enum: [ENTRY, MID, SENIOR, LEAD] }
        skills: { type: array, items: { type: string, maxLength: 80 } }
        salary_min: { type: number, minimum: 0 }
        salary_max: { type: number, minimum: 0 }
        salary_currency: { type: string, pattern: '^[A-Z]{3}$' }
        application_deadline: { type: string, format: date }
    Job:
      type: object
      required: [id, company, title, description, employment_type, workplace_type, experience_level, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        company: { type: object, required: [id, name], properties: { id: { type: string, format: uuid }, name: { type: string } } }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 20000 }
        employment_type: { type: string, enum: [FULL_TIME, PART_TIME, CONTRACT, TEMPORARY, INTERNSHIP] }
        workplace_type: { type: string, enum: [REMOTE, HYBRID, ON_SITE] }
        location: { type: string, maxLength: 160 }
        country: { type: string, pattern: '^[A-Z]{2}$' }
        experience_level: { type: string, enum: [ENTRY, MID, SENIOR, LEAD] }
        skills: { type: array, items: { type: string } }
        salary_min: { type: number, nullable: true }
        salary_max: { type: number, nullable: true }
        salary_currency: { type: string }
        application_deadline: { type: string, format: date, nullable: true }
        status: { type: string, enum: [DRAFT, PUBLISHED, CLOSED] }
        published_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Company:
      type: object
      required: [id, name, website, description, industry, company_size, headquarters_country, headquarters_city, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        website: { type: string, format: uri }
        description: { type: string }
        industry: { type: string, maxLength: 100 }
        company_size: { type: string, maxLength: 30 }
        headquarters_country: { type: string, maxLength: 2, example: IN }
        headquarters_city: { type: string, maxLength: 100 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CompanyInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        website: { type: string, format: uri }
        description: { type: string }
        industry: { type: string, maxLength: 100 }
        company_size: { type: string, maxLength: 30 }
        headquarters_country: { type: string, maxLength: 2, example: IN }
        headquarters_city: { type: string, maxLength: 100 }
    CompanyMembership:
      type: object
      required: [id, recruiter_id, recruiter_name, role, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        recruiter_id: { type: string, format: uuid }
        recruiter_name: { type: string }
        role: { type: string, enum: [OWNER, ADMIN, MEMBER] }
        status: { type: string, enum: [INVITED, ACTIVE, SUSPENDED] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CompanyMembershipInput:
      type: object
      required: [recruiter_id]
      properties:
        recruiter_id: { type: string, format: uuid }
        role: { type: string, enum: [ADMIN, MEMBER], default: MEMBER }
        status: { type: string, enum: [INVITED, ACTIVE, SUSPENDED], default: INVITED }
    CompanyMembershipUpdate:
      type: object
      properties:
        role: { type: string, enum: [OWNER, ADMIN, MEMBER] }
        status: { type: string, enum: [INVITED, ACTIVE, SUSPENDED] }
    CandidateProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string, maxLength: 160 }
        professional_headline: { type: string, maxLength: 200 }
        country: { type: string, maxLength: 2, example: IN }
        city: { type: string, maxLength: 100 }
        about: { type: string }
        years_of_experience: { type: integer, minimum: 0, maximum: 80 }
        current_designation: { type: string, maxLength: 160 }
        portfolio_url: { type: string, format: uri }
        github_url: { type: string, format: uri }
        linkedin_url: { type: string, format: uri }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CandidateProfileUpdate:
      type: object
      properties:
        full_name: { type: string, maxLength: 160 }
        professional_headline: { type: string, maxLength: 200 }
        country: { type: string, maxLength: 2, example: IN }
        city: { type: string, maxLength: 100 }
        about: { type: string }
        years_of_experience: { type: integer, minimum: 0, maximum: 80 }
        current_designation: { type: string, maxLength: 160 }
        portfolio_url: { type: string, format: uri }
        github_url: { type: string, format: uri }
        linkedin_url: { type: string, format: uri }
    RecruiterProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 160 }
        designation: { type: string, maxLength: 160 }
        work_email: { type: string, format: email }
        phone: { type: string, maxLength: 40 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RecruiterProfileUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 160 }
        designation: { type: string, maxLength: 160 }
        work_email: { type: string, format: email }
        phone: { type: string, maxLength: 40 }
    Skill:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
    CandidateRegistration:
      type: object
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
          example: candidate@example.test
        password:
          type: string
          format: password
          writeOnly: true
        full_name:
          type: string
          maxLength: 160
    RecruiterRegistration:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          example: recruiter@example.test
        password:
          type: string
          format: password
          writeOnly: true
        name:
          type: string
          maxLength: 160
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: candidate@example.test
        password:
          type: string
          format: password
          writeOnly: true
    SafeUser:
      type: object
      required: [id, email, role, is_platform_admin]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [candidate, recruiter, admin]
        is_platform_admin:
          type: boolean
          readOnly: true
          description: Active trusted Django staff or superuser identity; navigation hint only.
    TokenPair:
      type: object
      required: [refresh, access, user]
      properties:
        refresh:
          type: string
        access:
          type: string
        user:
          $ref: '#/components/schemas/SafeUser'
  responses:
    ResumeDownload:
      description: Private PDF attachment named resume.pdf. Cache-Control private, no-store; X-Content-Type-Options nosniff; sandbox CSP. Already-open downloads cannot be recalled.
      headers:
        Cache-Control: { schema: { type: string, const: 'private, no-store' } }
        Content-Disposition: { schema: { type: string } }
      content:
        application/pdf:
          schema: { type: string, format: binary }
    ValidationError:
      description: Field validation failed.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
