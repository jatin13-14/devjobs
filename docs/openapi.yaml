openapi: 3.1.0
info:
  title: DevJobs API
  version: 1.0.0
  description: Authentication, profile, company, job, candidate application, and recruiter applicant-management endpoints for the DevJobs MVP.
servers:
  - url: /
paths:
  /api/v1/health/:
    get:
      operationId: getHealth
      summary: Dependency-free liveness
      security: []
      responses:
        '200':
          description: API process responds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /api/v1/ready/:
    get:
      operationId: getApiV1Ready
      summary: Aggregate database, cache and private storage readiness
      security: []
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
          description: Required dependencies available
        '503':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
          description: Required dependency unavailable; no infrastructure details

  /api/v1/admin/companies/:
    get:
      operationId: getApiV1AdminCompanies
      summary: Administrator-only paginated companies; search and state filters
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: state, schema: { type: string, enum: [active, restricted] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Paginated count/next/previous/results; private administrative records without storage references.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCompanyPage' }
        '401': { description: "Authentication required." }
        '403': { description: "Trusted active staff/superuser required." }
  /api/v1/admin/companies/{target_id}/:
    parameters:
      - { in: path, name: target_id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getApiV1AdminCompaniesTargetId
      summary: Inspect companies as platform administrator
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Administrative record; excludes resume keys and credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCompany' }
        '403': { description: "Platform administrator required." }
        '404': { description: "Target missing." }
    post:
      operationId: postApiV1AdminCompaniesTargetId
      summary: Record an atomic moderation decision for companies
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, reason]
              properties:
                action: { type: string, enum: [suspend, reactivate] }
                reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Changed record; append-only audit event committed atomically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCompany' }
        '400': { description: "Invalid action, reason or already in requested state." }
        '403': { description: "Platform administrator required; privileged accounts cannot be moderated." }
        '404': { description: "Target missing." }
  /api/v1/admin/recruiters/:
    get:
      operationId: getApiV1AdminRecruiters
      summary: Administrator-only paginated recruiters; search and state filters
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: state, schema: { type: string, enum: [active, restricted] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Paginated count/next/previous/results; private administrative records without storage references.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
        '401': { description: "Authentication required." }
        '403': { description: "Trusted active staff/superuser required." }
  /api/v1/admin/recruiters/{target_id}/:
    parameters:
      - { in: path, name: target_id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getApiV1AdminRecruitersTargetId
      summary: Inspect recruiters as platform administrator
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Administrative record; excludes resume keys and credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '403': { description: "Platform administrator required." }
        '404': { description: "Target missing." }
    post:
      operationId: postApiV1AdminRecruitersTargetId
      summary: Record an atomic moderation decision for recruiters
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, reason]
              properties:
                action: { type: string, enum: [suspend, reactivate] }
                reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Changed record; append-only audit event committed atomically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { description: "Invalid action, reason or already in requested state." }
        '403': { description: "Platform administrator required; privileged accounts cannot be moderated." }
        '404': { description: "Target missing." }
  /api/v1/admin/candidates/:
    get:
      operationId: getApiV1AdminCandidates
      summary: Administrator-only paginated candidates; search and state filters
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: state, schema: { type: string, enum: [active, restricted] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Paginated count/next/previous/results; private administrative records without storage references.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
        '401': { description: "Authentication required." }
        '403': { description: "Trusted active staff/superuser required." }
  /api/v1/admin/candidates/{target_id}/:
    parameters:
      - { in: path, name: target_id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getApiV1AdminCandidatesTargetId
      summary: Inspect candidates as platform administrator
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Administrative record; excludes resume keys and credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '403': { description: "Platform administrator required." }
        '404': { description: "Target missing." }
    post:
      operationId: postApiV1AdminCandidatesTargetId
      summary: Record an atomic moderation decision for candidates
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, reason]
              properties:
                action: { type: string, enum: [suspend, reactivate] }
                reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Changed record; append-only audit event committed atomically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { description: "Invalid action, reason or already in requested state." }
        '403': { description: "Platform administrator required; privileged accounts cannot be moderated." }
        '404': { description: "Target missing." }
  /api/v1/admin/jobs/:
    get:
      operationId: getApiV1AdminJobs
      summary: Administrator-only paginated jobs; search and state filters
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: state, schema: { type: string, enum: [active, restricted] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Paginated count/next/previous/results; private administrative records without storage references.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminJobPage' }
        '401': { description: "Authentication required." }
        '403': { description: "Trusted active staff/superuser required." }
  /api/v1/admin/jobs/{target_id}/:
    parameters:
      - { in: path, name: target_id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getApiV1AdminJobsTargetId
      summary: Inspect jobs as platform administrator
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Administrative record; excludes resume keys and credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminJob' }
        '403': { description: "Platform administrator required." }
        '404': { description: "Target missing." }
    post:
      operationId: postApiV1AdminJobsTargetId
      summary: Record an atomic moderation decision for jobs
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, reason]
              properties:
                action: { type: string, enum: [hide, restore] }
                reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Changed record; append-only audit event committed atomically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminJob' }
        '400': { description: "Invalid action, reason or already in requested state." }
        '403': { description: "Platform administrator required; privileged accounts cannot be moderated." }
        '404': { description: "Target missing." }
  /api/v1/admin/overview/:
    get:
      operationId: getApiV1AdminOverview
      summary: Resource counts
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Resource counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOverview' }
        '403': { description: "Platform administrator required." }
  /api/v1/admin/history/:
    get:
      operationId: getApiV1AdminHistory
      summary: Paginated immutable audit events; target_type, target_id and action filters
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Paginated immutable audit events; target_type, target_id and action filters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationEventPage' }
        '403': { description: "Platform administrator required." }
  /api/v1/candidates/me/resume/:
    get:
      summary: Read own resume metadata (resume is null when absent)
      operationId: candidateResumeMetadata
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Safe metadata only; no storage keys, paths or URLs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeStatus' }
        '401': { description: "Authentication required." }
        '403': { description: "Candidate account required." }
        '404': { description: "Candidate profile missing." }
    put:
      summary: Upload or atomically replace own current resume
      operationId: replaceCandidateResume
      security: [{ bearerAuth: [] }]
      description: Exactly one structurally valid, unencrypted PDF with pages. Default limit 5242880 bytes, configurable with RESUME_MAX_BYTES. Filename and client MIME are ignored.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              additionalProperties: false
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Current resume metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeStatus' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: "Authentication required." }
        '403': { description: "Candidate account required." }
        '404': { description: "Candidate profile missing." }
        '415': { description: "multipart/form-data required." }
        '503': { description: "Storage or database operation failed; previous resume retained." }
    delete:
      summary: Idempotently delete own resume and revoke future downloads
      operationId: deleteCandidateResume
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: "Resume absent; file cleanup runs after commit." }
        '401': { description: "Authentication required." }
        '403': { description: "Candidate account required." }
        '404': { description: "Candidate profile missing." }
        '503': { description: "Database operation failed." }
  /api/v1/candidates/me/resume/download/:
    get:
      summary: Download own current resume
      operationId: downloadCandidateResume
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/ResumeDownload' }
        '401': { description: "Authentication required." }
        '403': { description: "Candidate account required." }
        '404': { description: "Resume unavailable." }
  /api/v1/jobs/{job_id}/applications/{application_id}/resume/:
    parameters:
      - { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: application_id, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Download an applicant's current resume
      operationId: downloadApplicantResume
      security: [{ bearerAuth: [] }]
      description: Active recruiter and active OWNER/ADMIN membership for the job company required on every request. Withdrawn applications and inactive candidates are denied. Closed/expired jobs and rejected applications retain access. No application snapshot is stored.
      responses:
        '200': { $ref: '#/components/responses/ResumeDownload' }
        '401': { description: "Authentication required." }
        '403': { description: "Active company OWNER/ADMIN required." }
        '404': { description: "Job/application missing, application belongs to another job, withdrawn application, inactive candidate or missing resume." }
  /api/v1/companies/:
    post:
      summary: Create a company and become its first active owner
      operationId: createCompany
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyInput' }
      responses:
        '201':
          description: Company and creator's active owner membership.
          content:
            application/json:
              schema:
                type: object
                required: [company, membership]
                properties:
                  company: { $ref: '#/components/schemas/Company' }
                  membership: { $ref: '#/components/schemas/CompanyMembership' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: "Authentication required." }
        '403': { description: "Recruiter account required." }
  /api/v1/companies/{company_id}/:
    parameters:
      - in: path
        name: company_id
        required: true
        schema: { type: string, format: uuid }
    get:
      security: []
      summary: Read public company information
      operationId: getCompany
      responses:
        '200':
          description: Public company fields; the private logo storage reference is omitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '404': { description: "Company not found." }
    patch:
      summary: Update company information
      operationId: updateCompany
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyUpdate' }
      responses:
        '200':
          description: Updated company information.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: "Authentication required." }
        '403': { description: "Active owner or admin membership required." }
  /api/v1/companies/{company_id}/members/:
    parameters:
      - in: path
        name: company_id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List company recruiter memberships
      operationId: listCompanyMembers
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Memberships with recruiter display name and account ID only.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CompanyMembership' }
        '403': { description: "Active owner or admin membership required." }
    post:
      summary: Add or invite a recruiter to a company
      operationId: addCompanyMember
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyMembershipInput' }
      responses:
        '201':
          description: Membership created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyMembership' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: "Active owner or admin membership required." }
  /api/v1/companies/{company_id}/members/{membership_id}/:
    parameters:
      - in: path
        name: company_id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: membership_id
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Change membership role or status, including ownership transfer
      operationId: updateCompanyMember
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyMembershipUpdate' }
      responses:
        '200':
          description: Updated membership.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyMembership' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: "Active owner or admin membership required." }
        '404': { description: "Membership does not belong to this company." }
    delete:
      summary: Remove a non-owner membership
      operationId: removeCompanyMember
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: "Membership removed." }
        '400': { description: "The active owner must transfer ownership first." }
        '403': { description: "Active owner or admin membership required." }
        '404': { description: "Membership does not belong to this company." }
  /api/v1/auth/candidate/register/:
    post:
      security: []
      summary: Register a candidate
      operationId: registerCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateRegistration'
      responses:
        '201':
          description: Candidate account and profile created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeUser'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/recruiter/register/:
    post:
      security: []
      summary: Register a recruiter
      operationId: registerRecruiter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecruiterRegistration'
      responses:
        '201':
          description: Recruiter account and profile created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeUser'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/login/:
    post:
      security: []
      summary: Obtain JWTs using email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT pair and safe user identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Invalid credentials.
        '429':
          description: Token issuance rate limit exceeded.
  /api/v1/auth/token/:
    post:
      security: []
      summary: Compatibility route for login
      operationId: obtainTokenPair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT pair and safe user identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Invalid credentials.
        '429':
          description: Token issuance rate limit exceeded.
  /api/v1/auth/token/refresh/:
    post:
      security: []
      summary: Refresh an access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh:
                  type: string
      responses:
        '200':
          description: New access token.
          content:
            application/json:
              schema:
                type: object
                required: [access]
                properties:
                  access:
                    type: string
                  refresh:
                    type: string
        '400':
          description: Missing refresh token.
        '401':
          description: Invalid or expired refresh token.
  /api/v1/candidates/me/profile/:
    get:
      summary: Read the authenticated candidate profile
      operationId: getCandidateProfile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Candidate profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfile'
        '401': { description: "Authentication required." }
        '403': { description: "Candidate role required." }
    patch:
      summary: Partially update the authenticated candidate profile
      operationId: patchCandidateProfile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateProfileUpdate'
      responses:
        '200':
          description: Updated candidate profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfile'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: "Authentication required." }
        '403': { description: "Candidate role required." }
  /api/v1/candidates/me/skills/:
    get:
      summary: List the authenticated candidate skills
      operationId: listCandidateSkills
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Skills, ordered by normalized name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Skill' }
        '401': { description: "Authentication required." }
        '403': { description: "Candidate role required." }
    post:
      summary: Add a skill to the authenticated candidate
      operationId: addCandidateSkill
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80, example: "  PYTHON Developer " }
      responses:
        '201':
          description: New candidate-skill association.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '200':
          description: Existing association reused.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Skill' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: "Authentication required." }
        '403': { description: "Candidate role required." }
  /api/v1/candidates/me/skills/{skill_id}/:
    delete:
      summary: Remove a skill from the authenticated candidate
      operationId: removeCandidateSkill
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: skill_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: "Association removed." }
        '401': { description: "Authentication required." }
        '403': { description: "Candidate role required." }
        '404': { description: "Association not found for this candidate." }
  /api/v1/recruiters/me/profile/:
    get:
      summary: Read the authenticated recruiter profile
      operationId: getRecruiterProfile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Recruiter profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecruiterProfile' }
        '401': { description: "Authentication required." }
        '403': { description: "Recruiter role required." }
    patch:
      summary: Partially update the authenticated recruiter profile
      operationId: patchRecruiterProfile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecruiterProfileUpdate' }
      responses:
        '200':
          description: Updated recruiter profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecruiterProfile' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { description: "Authentication required." }
        '403': { description: "Recruiter role required." }
  /api/v1/recruiters/me/companies/:
    get:
      summary: List active company memberships for the authenticated recruiter
      operationId: listMyRecruiterCompanies
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active memberships; an empty array means the recruiter has no active company memberships.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, membership_id, role]
                  properties:
                    id: { type: string, format: uuid, description: Company UUID. }
                    name: { type: string }
                    membership_id: { type: string, format: uuid }
                    role: { type: string, enum: [OWNER, ADMIN, MEMBER] }
        '401': { description: "Authentication required." }
        '403': { description: "Recruiter role required." }
  /api/v1/jobs/:
    get:
      security: []
      summary: Search published, non-expired jobs
      operationId: listJobs
      parameters:
        - { in: query, name: search, schema: { type: string }, description: Search title and description. }
        - { in: query, name: country, schema: { type: string, pattern: '^[A-Z]{2}$' } }
        - { in: query, name: location, schema: { type: string } }
        - { in: query, name: workplace_type, schema: { type: string, enum: [REMOTE, HYBRID, ON_SITE] } }
        - { in: query, name: employment_type, schema: { type: string, enum: [FULL_TIME, PART_TIME, CONTRACT, TEMPORARY, INTERNSHIP] } }
        - { in: query, name: experience_level, schema: { type: string, enum: [ENTRY, MID, SENIOR, LEAD] } }
        - { in: query, name: skill, schema: { type: string } }
        - { in: query, name: company, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Paginated public jobs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPage' }
    post:
      summary: Create a draft job
      operationId: createJob
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobInput' }
      responses:
        '201':
          description: Draft created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: "Active recruiter OWNER or ADMIN membership required." }
  /api/v1/jobs/{job_id}/:
    parameters:
      - { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
    get:
      security: []
      summary: Read public job details
      operationId: getJob
      responses:
        '200':
          description: Published, non-expired job details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { description: "Missing, draft, closed, or expired job." }
    patch:
      summary: Update an authorized company's job
      operationId: updateJob
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobUpdate' }
      responses:
        '200':
          description: Updated job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '403': { description: "Active company OWNER or ADMIN membership required." }
  /api/v1/jobs/{job_id}/publish/:
    post:
      summary: Publish a draft job
      operationId: publishJob
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Published job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { description: "Closed jobs cannot be republished." }
        '403': { description: "Active company OWNER or ADMIN membership required." }
  /api/v1/jobs/{job_id}/close/:
    post:
      summary: Close a job
      operationId: closeJob
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Closed job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '403': { description: "Active company OWNER or ADMIN membership required." }
  /api/v1/companies/{company_id}/jobs/:
    get:
      security: []
      summary: List visible jobs for a company
      operationId: listCompanyJobs
      parameters:
        - name: status
          in: query
          description: Filters within the caller's authorized company job visibility.
          schema: {type: string, enum: [DRAFT, PUBLISHED, CLOSED]}
        - { in: path, name: company_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: OWNER/ADMIN members see drafts; other callers see public jobs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPage' }
        '404': { description: "Company not found." }
  /api/v1/jobs/{job_id}/applications/:
    parameters:
      - { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Apply to a published, open job
      operationId: applyToJob
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationInput' }
      responses:
        '201':
          description: Application submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: "Candidate profile required." }
    get:
      summary: List applicants for a job
      operationId: listJobApplicants
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Paginated applications with an additive resume_available boolean; requires active company OWNER or ADMIN membership.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationPage' }
        '403': { description: "Active company OWNER or ADMIN membership required." }
  /api/v1/jobs/{job_id}/applications/{application_id}/:
    parameters:
      - { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: application_id, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Retrieve an applicant for an authorized job
      operationId: getJobApplicant
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Applicant details with limited candidate profile fields and an additive resume_available boolean (false when withdrawn, inactive candidate or resume absent).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '403': { description: "Active company OWNER or ADMIN membership required." }
        '404': { description: "Job or job application not found." }
  /api/v1/jobs/{job_id}/applications/{application_id}/status/:
    parameters:
      - { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: application_id, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Update an applicant status
      operationId: updateApplicationStatus
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationStatusUpdate' }
      responses:
        '200':
          description: Status updated and recorded in history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: "Active company OWNER or ADMIN membership required." }
        '404': { description: "Job or job application not found." }
  /api/v1/candidates/me/applications/:
    get:
      summary: List the authenticated candidate's applications
      operationId: listMyApplications
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Paginated applications belonging to the authenticated candidate, including resume_available.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationPage' }
        '403': { description: "Candidate profile required." }
  /api/v1/candidates/me/applications/{application_id}/:
    parameters:
      - { in: path, name: application_id, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Retrieve the authenticated candidate's application
      operationId: getMyApplication
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Candidate-owned application including resume_available.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '404': { description: "Application not found." }
    patch:
      summary: Withdraw an eligible application using an empty object
      operationId: withdrawMyApplication
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Application withdrawn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: "Application not found." }
components:
  schemas:
    CompanyUpdate:
      type: object
      required: []
      properties:
        name:
          type: string
          maxLength: 200
        website:
          anyOf:
            - { type: string, format: uri }
            - { const: '' }
        description:
          type: string
        industry:
          type: string
          maxLength: 100
        company_size:
          type: string
          maxLength: 30
        headquarters_country:
          type: string
          maxLength: 2
          example: IN
        headquarters_city:
          type: string
          maxLength: 100
    JobUpdate:
      type: object
      required: []
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 20000
        employment_type:
          type: string
          enum:
          - FULL_TIME
          - PART_TIME
          - CONTRACT
          - TEMPORARY
          - INTERNSHIP
        workplace_type:
          type: string
          enum:
          - REMOTE
          - HYBRID
          - ON_SITE
        location:
          type: string
          maxLength: 160
        country:
          type: string
          pattern: '^([A-Z]{2})?$'
        experience_level:
          type: string
          enum:
          - ENTRY
          - MID
          - SENIOR
          - LEAD
        skills:
          type: array
          items:
            type: string
            maxLength: 80
        salary_min:
          type: [number, string, 'null']
        salary_max:
          type: [number, string, 'null']
        salary_currency:
          type: string
          pattern: '^([A-Z]{3})?$'
        application_deadline:
          type: [string, 'null']
          format: date
    Health:
      type: object
      required:
      - status
      - service
      properties:
        status:
          const: ok
        service:
          const: devjobs-api
    Readiness:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ready
          - unavailable
    AdminCompany:
      type: object
      required:
      - id
      - name
      - description
      - website
      - is_suspended
      - created_at
      properties:
        id: &id002
          type: string
          format: uuid
        name: &id001
          type: string
        description: *id001
        website: *id001
        is_suspended: &id003
          type: boolean
        created_at: &id004
          type: string
          format: date-time
    AdminJob:
      type: object
      required:
      - id
      - title
      - description
      - status
      - is_hidden
      - company
      - created_at
      properties:
        id: *id002
        title: *id001
        description: *id001
        status:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - CLOSED
        is_hidden: *id003
        company: *id001
        created_at: *id004
    AdminUser:
      type: object
      required:
      - id
      - email
      - role
      - is_active
      - name
      - created_at
      properties:
        id: *id002
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - candidate
          - recruiter
        is_active: *id003
        name: *id001
        created_at: *id004
    AdminOverview:
      type: object
      required:
      - companies
      - recruiters
      - candidates
      - jobs
      properties:
        companies:
          type: integer
          minimum: 0
        recruiters:
          type: integer
          minimum: 0
        candidates:
          type: integer
          minimum: 0
        jobs:
          type: integer
          minimum: 0
    ModerationEvent:
      type: object
      required:
      - id
      - administrator
      - target_type
      - target_id
      - action
      - reason
      - previous_state
      - new_state
      - created_at
      properties:
        id: *id002
        administrator: *id002
        target_type:
          type: string
          enum:
          - users
          - companies
          - jobs
        target_id: *id002
        action:
          type: string
          enum:
          - suspend
          - reactivate
          - hide
          - restore
        reason: *id001
        previous_state: *id003
        new_state: *id003
        created_at: *id004
    Application:
      type: object
      required:
      - id
      - job
      - candidate
      - status
      - cover_letter
      - applied_at
      - updated_at
      - withdrawn_at
      - resume_available
      properties:
        id: *id002
        job:
          type: object
          required:
          - id
          - title
          - company
          properties:
            id: *id002
            title: *id001
            company: *id001
        candidate:
          type: object
          required:
          - full_name
          - professional_headline
          - country
          - city
          - years_of_experience
          - current_designation
          - skills
          properties:
            full_name:
              type: string
              maxLength: 160
            professional_headline:
              type: string
              maxLength: 200
            country:
              type: string
              maxLength: 2
              example: IN
            city:
              type: string
              maxLength: 100
            years_of_experience:
              type: integer
              minimum: 0
              maximum: 80
            current_designation:
              type: string
              maxLength: 160
            skills:
              type: array
              items: *id001
        status:
          type: string
          enum:
          - SUBMITTED
          - REVIEWING
          - SHORTLISTED
          - REJECTED
          - WITHDRAWN
        cover_letter: *id001
        applied_at: *id004
        updated_at: *id004
        withdrawn_at:
          type:
          - string
          - 'null'
          format: date-time
        resume_available: *id003
    AdminCompanyPage:
      type: object
      required:
      - count
      - next
      - previous
      - results
      properties:
        count:
          type: integer
          minimum: 0
        next:
          type:
          - string
          - 'null'
          format: uri
        previous:
          type:
          - string
          - 'null'
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminCompany'
    AdminJobPage:
      type: object
      required:
      - count
      - next
      - previous
      - results
      properties:
        count:
          type: integer
          minimum: 0
        next:
          type:
          - string
          - 'null'
          format: uri
        previous:
          type:
          - string
          - 'null'
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminJob'
    AdminUserPage:
      type: object
      required:
      - count
      - next
      - previous
      - results
      properties:
        count:
          type: integer
          minimum: 0
        next:
          type:
          - string
          - 'null'
          format: uri
        previous:
          type:
          - string
          - 'null'
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
    ModerationEventPage:
      type: object
      required:
      - count
      - next
      - previous
      - results
      properties:
        count:
          type: integer
          minimum: 0
        next:
          type:
          - string
          - 'null'
          format: uri
        previous:
          type:
          - string
          - 'null'
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/ModerationEvent'
    JobPage:
      type: object
      required:
      - count
      - next
      - previous
      - results
      properties:
        count:
          type: integer
          minimum: 0
        next:
          type:
          - string
          - 'null'
          format: uri
        previous:
          type:
          - string
          - 'null'
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/Job'
    ApplicationPage:
      type: object
      required:
      - count
      - next
      - previous
      - results
      properties:
        count:
          type: integer
          minimum: 0
        next:
          type:
          - string
          - 'null'
          format: uri
        previous:
          type:
          - string
          - 'null'
          format: uri
        results:
          type: array
          items:
            $ref: '#/components/schemas/Application'
    ResumeStatus:
      type: object
      required: [resume]
      additionalProperties: false
      properties:
        resume:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/ResumeMetadata' }
    ResumeMetadata:
      type: object
